name: Offline Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests with the committed snapshot
        run: python -m unittest discover -s tests -v
      - name: Reproduce the two fictional comparisons
        run: |
          python estimate.py examples/laboratorio.json --json
          python estimate.py examples/redimensionamento.json --json
